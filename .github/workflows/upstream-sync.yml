name: Upstream Sync

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }} --source 7Sageer/sublink-worker --branch main

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prevent 60-day auto-disable
        uses: gautamkrishnar/keepalive-workflow@v2
